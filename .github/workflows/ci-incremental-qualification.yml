name: Incremental CI qualification

on:
  pull_request:
    paths:
      - package.json
      - turbo.json
      - .github/ci-task-matrix.json
      - .github/scripts/ci-plan.mjs
      - .github/scripts/tests/ci-plan.test.mjs
      - .github/actions/run-ci-task/**
      - .github/workflows/ci-routing.yml
      - .github/workflows/pr-trusted.yml
      - .github/workflows/ci-incremental-qualification.yml
      - scripts/ci/**

permissions:
  contents: read

concurrency:
  group: incremental-ci-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated qualification tools
        run: npm install --prefix "$RUNNER_TEMP/ci-tools" --no-audit --no-fund turbo@2.11.10
      - name: Prove planning and required checks
        run: node --test .github/scripts/tests/ci-plan.test.mjs .github/scripts/tests/ci-routing.test.mjs
      - name: Prove real cache reuse and invalidation
        env:
          PAPERCLIP_CI_TEST_TURBO: ${{ runner.temp }}/ci-tools/node_modules/.bin/turbo
        run: node --test scripts/ci/cache.integration.test.mjs
      - name: Check the real repository task graph
        run: |
          "$RUNNER_TEMP/ci-tools/node_modules/.bin/turbo" run ci:server ci:db ci:runner-rust --dry=json --cache-dir=.turbo/cache > "$RUNNER_TEMP/ci-task-graph.json"
      - name: Explain this pull request's plan
        env:
          CI_INCREMENTAL_MODE: shadow
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: node .github/scripts/ci-plan.mjs "$BASE_SHA" "$MERGE_SHA"
